<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ivy Finder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body class="capture">
  <header>
    <h1>Ivy Finder</h1>
    <button id="pending" class="link" type="button" hidden></button>
    <a href="../dashboard/">Map</a>
    <button id="signout" class="link" type="button">Sign out</button>
  </header>

  <form id="login" class="card" hidden>
    <fieldset>
      <legend>Sign in</legend>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Sign in</button>
    </fieldset>
    <p class="error" role="alert"></p>
  </form>

  <main id="main" hidden>
    <div id="viewfinder">
      <video id="video" playsinline muted autoplay></video>
      <div id="guide" aria-hidden="true"></div>
      <div id="flash" aria-hidden="true"></div>
      <button id="alert" type="button" hidden></button>
      <div id="meter" aria-hidden="true" hidden><div id="meter-fill"></div><div id="meter-mark"></div></div>
    </div>

    <p id="gps" class="status">Waiting for GPS…</p>
    <p id="detector" class="status" role="status"></p>
    <p id="message" class="status" role="status"></p>

    <section class="controls">
      <div class="chips" data-field="subject" role="group" aria-label="What the photo shows">
        <button type="button" data-value="ivy">Ivy</button>
        <button type="button" data-value="lookalike">Look-alike</button>
        <button type="button" data-value="trunk_no_ivy">Trunk, no ivy</button>
        <button type="button" data-value="other_vegetation">Other plants</button>
        <button type="button" data-value="no_vegetation">No plants</button>
      </div>

      <div id="ivy-fields">
        <div class="chips" data-field="growth_form" role="group" aria-label="Growth form">
          <button type="button" data-value="climbing">Climbing</button>
          <button type="button" data-value="ground">Ground</button>
          <button type="button" data-value="both">Both</button>
        </div>
        <div class="chips" data-field="trunk_height" role="group" aria-label="Height on trunk">
          <button type="button" data-value="base">Base only</button>
          <button type="button" data-value="mid_trunk">Mid-trunk</button>
          <button type="button" data-value="canopy">Into canopy</button>
        </div>
        <div class="toggles">
          <label><input type="checkbox" id="mature"> Flowers or berries</label>
          <label><input type="checkbox" id="vines_cut"> Vines cut</label>
        </div>
      </div>

      <input id="notes" type="text" placeholder="Notes for this photo (optional)" autocomplete="off">
    </section>

    <div class="shutter-bar">
      <button id="shutter" type="button" class="primary" disabled>Capture</button>
    </div>
  </main>

  <script src="../vendor/supabase-2.119.0.js"></script>
  <script src="../vendor/tf-4.22.0.min.js" defer></script>
  <script src="../config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
